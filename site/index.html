<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI Berkshire 个股投资决策看板：主报告结论、技术面辅助观察与实时行情" />
    <title>投资决策看板 | AI Berkshire</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/styles.css?v=20260731-technical" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">AB</div>
          <div>
            <p class="eyebrow">AI BERKSHIRE</p>
            <h1>个股投资决策看板</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="live-pill" id="live-status" title="行情状态">
            <span class="live-dot" id="live-dot"></span>
            <span id="live-text">行情加载中</span>
          </div>
          <button type="button" class="btn ghost" id="refresh-quotes" title="立即刷新 A/H 实时行情">刷新行情</button>
          <a class="btn ghost" href="https://github.com/yuzi1441/ai-berkshire" target="_blank" rel="noreferrer">研究库</a>
        </div>
      </header>

      <section class="summary-band" aria-label="决策总览">
        <div class="summary-grid" id="summary"></div>
      </section>

      <section class="control-band" aria-label="筛选与检索">
        <div class="search-box">
          <label class="sr-only" for="company-filter">检索公司或代码</label>
          <input
            id="company-filter"
            type="search"
            placeholder="搜索公司 / 代码，Enter 打开第一条 · / 聚焦"
            autocomplete="off"
          />
          <kbd class="hint-key">/</kbd>
        </div>
        <div class="chip-row" id="market-chips" role="tablist" aria-label="市场">
          <button type="button" class="chip active" data-market="all">全部</button>
          <button type="button" class="chip" data-market="A股">A股</button>
          <button type="button" class="chip" data-market="港股">港股</button>
          <button type="button" class="chip" data-market="美股">美股</button>
          <button type="button" class="chip" data-market="未识别">待识别</button>
        </div>
        <div class="chip-row advice-filter-row" id="action-chips" role="tablist" aria-label="综合操作筛选">
          <span class="filter-label">综合操作筛选</span>
          <button type="button" class="chip active" data-action="all">全部</button>
          <button type="button" class="chip advice-conservative" data-action="buy">买入区</button>
          <button type="button" class="chip advice-trial" data-action="trial">小仓试探区</button>
          <button type="button" class="chip advice-balanced" data-action="hold">持有区</button>
          <button type="button" class="chip advice-aggressive" data-action="watch">观察区</button>
          <button type="button" class="chip advice-no" data-action="no">减仓/排除区</button>
          <button type="button" class="chip advice-unknown" data-action="unknown">无法归类</button>
        </div>
        <div class="control-meta">
          <label class="sort-field">
            <span>排序</span>
            <select id="sort-select">
              <option value="buy_advice">按综合操作</option>
              <option value="action">按研究结论</option>
              <option value="change">按当日涨跌</option>
              <option value="cutoff">按研报截止日</option>
              <option value="name">按公司名</option>
            </select>
          </label>
          <button type="button" class="btn text" id="clear-filters">清除筛选</button>
          <p class="data-status" id="data-status"></p>
        </div>
      </section>

      <div class="workspace" id="workspace">
        <section class="table-panel" aria-label="个股列表">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">公司</th>
                  <th scope="col">市场/代码</th>
                  <th scope="col">报告价格行动表</th>
                  <th scope="col">现价</th>
                  <th scope="col">综合操作归类</th>
                  <th scope="col">技术面</th>
                  <th scope="col">研报日</th>
                </tr>
              </thead>
              <tbody id="decision-rows"></tbody>
            </table>
            <div class="empty-state" id="empty-state" hidden>
              <div class="empty-icon" aria-hidden="true">∅</div>
              <p class="empty-title">没有匹配的个股</p>
              <p class="empty-desc">试试清除筛选，或换个关键词</p>
            </div>
          </div>
          <p class="table-hint">点击行查看技术面 · <kbd>j</kbd>/<kbd>k</kbd> 切换 · <kbd>Enter</kbd> 详情 · <kbd>Esc</kbd> 关闭 · <kbd>/</kbd> 搜索</p>
        </section>

        <aside class="detail-panel" id="detail-panel" hidden aria-label="个股详情">
          <div class="detail-head">
            <div>
              <p class="detail-kicker" id="detail-kicker">个股详情</p>
              <h2 id="detail-title">选择一家公司</h2>
              <p class="detail-sub" id="detail-sub"></p>
            </div>
            <button type="button" class="btn icon" id="detail-close" aria-label="关闭详情">×</button>
          </div>
          <div class="detail-tabs" role="tablist">
            <button type="button" class="tab active" data-tab="technical">技术面</button>
            <button type="button" class="tab" data-tab="overview">摘要</button>
            <button type="button" class="tab" data-tab="history">历史研报</button>
          </div>
          <div class="detail-body" id="detail-body"></div>
          <div class="detail-foot">
            <a class="btn primary" id="detail-report" href="#" target="_blank" rel="noreferrer">打开研报</a>
            <button type="button" class="btn ghost" id="detail-copy-link">复制链接</button>
          </div>
        </aside>
      </div>

      <footer class="app-footer">
        仅收录个股研究；综合操作和筛选仅依据主报告，技术面只辅助观察节奏，不构成投资建议。
        行情优先实时拉取腾讯 A/H 接口，失败时回退本地快照。
      </footer>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script type="module" src="./assets/app.js?v=20260731-technical"></script>
  </body>
</html>
