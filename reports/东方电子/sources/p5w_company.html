    function follow(obj,id,is_focus){
        var type = is_focus == 1 ? 0 : 1;
        $(obj).removeAttr("onclick");
        var followUrl = "/Roadshow/follow.html";
        $.ajax({
            dataType:'json',
            type : "post",
            url:followUrl,
            data:{id:id,type:type},
            success:function(data){
                if (data.code == 1) {
                    if(type == 1){
                        $(obj).removeClass('focus');
                        $(obj).addClass('is-focus');
                    }else{
                        $(obj).removeClass('is-focus');
                        $(obj).addClass('focus');
                    }
                    $(obj).attr("onclick","follow(this,'" + id + "'," + type +")");
                }else{
                    mui.alert(data.message, '提示消息', function() {
                    });
                }
            }
        });
    }

                        $("#dqjg").html(data.data.preclose_px);
                    }

                    $("#dqjg").removeClass('index_stock_status1').removeClass('index_stock_status2').removeClass('index_stock_status3');
                    //$("#dqzf").html(data.data.zdbfb);
                    $("#dqzf").removeClass('index_stock_status_back_1').removeClass('index_stock_status_back_2').removeClass('index_stock_status_back_3');
                    var style_back = '';
                    var style_jg ='';
                    var px_change_rate='0';
                    if(data.data.px_change_rate >0){
                        style_back = 'index_stock_status_back_1';
                        style_jg = 'index_stock_status1';
                        px_change_rate = '+'+data.data.px_change_rate.toFixed(2)+'%'
                    }else if(data.data.px_change_rate <0){
                        style_back = 'index_stock_status_back_2';
                        style_jg = 'index_stock_status2';
                        px_change_rate = data.data.px_change_rate.toFixed(2)+'%'
                    }else {
                        style_back = 'index_stock_status_back_3';
                        style_jg = 'index_stock_status3';
                        px_change_rate = data.data.px_change_rate.toFixed(2)+'%'
                    }
                    $("#dqzf").html(px_change_rate);
                    $("#dqzf").addClass(style_back);
                    $("#dqjg").addClass(style_jg);

                    $(".company_hq_div").show();
                }
            }
        });
    }
</script>

	//加载行情数据
    getStockData();
	var gssiv=0;
    gssiv = setInterval('getStockData()',600000);

</script>
